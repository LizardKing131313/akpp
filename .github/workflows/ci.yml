name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Check pnpm
        shell: bash
        run: pnpm --version

      - name: Install dependencies
        shell: bash
        run: pnpm -w install --frozen-lockfile

      - name: Lint
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm exec eslint --no-error-on-unmatched-pattern apps/web/app apps/web/server apps/web/shared apps/web/*.ts

      - name: Typecheck web
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm -C apps/web typecheck

      - name: Build web
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm -C apps/web build

      - name: Format check
        shell: bash
        run: pnpm prettier --check .
