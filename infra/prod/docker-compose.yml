name: akpp-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - akpp_prod_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - akpp_prod_redis:/data

  directus:
    image: directus/directus:11
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}

      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      CACHE_ENABLED: 'true'
      CACHE_STORE: redis
      REDIS: redis://redis:6379

      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}

    volumes:
      - akpp_prod_directus_uploads:/directus/uploads
      - akpp_prod_directus_extensions:/directus/extensions
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:8055/server/health'').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  directus-schema-apply:
    image: directus/directus:11
    depends_on:
      directus:
        condition: service_healthy
    environment:
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./schema.json:/schema/schema.json:ro
    entrypoint: >
      sh -c "
        echo 'Directus is healthy. Applying schema...' &&
        npx directus schema apply /schema/schema.json --yes
      "
    restart: 'no'

  directus-restart-after-apply:
    image: docker:27-cli
    depends_on:
      directus-schema-apply:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: >
      sh -c "
        set -e;
        CID=$$(docker ps -q --filter label=com.docker.compose.project=akpp-prod --filter label=com.docker.compose.service=directus);
        [ -n \"$$CID\" ] || { echo 'Directus container not found'; exit 1; };
        echo 'Restarting Directus...';
        docker restart \"$$CID\" >/dev/null;
        echo 'Waiting Directus health=healthy...';
        until [ \"$$(docker inspect -f '{{.State.Health.Status}}' \"$$CID\")\" = 'healthy' ]; do sleep 1; done;
        echo 'Directus is healthy after restart.';
      "
    restart: 'no'

  directus-settings-apply:
    image: directus/directus:11
    depends_on:
      directus-restart-after-apply:
        condition: service_completed_successfully
    environment:
      DIRECTUS_URL: ${DIRECTUS_INTERNAL_URL}
      DIRECTUS_ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      DIRECTUS_ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
    volumes:
      - ./:/schema:ro
    entrypoint: >
      sh -c "
        echo 'Directus is ready. Applying settings...' &&
        node -e '
          const fs = require(\"node:fs\");
          const baseUrl = process.env.DIRECTUS_URL;
          const email = process.env.DIRECTUS_ADMIN_EMAIL;
          const password = process.env.DIRECTUS_ADMIN_PASSWORD;
          const settings = fs.readFileSync(\"/schema/directus.settings.json\", \"utf8\");
          (async () => {
            const login = await fetch(baseUrl + \"/auth/login\", {
              method: \"POST\",
              headers: { \"Content-Type\": \"application/json\" },
              body: JSON.stringify({ email, password }),
            });
            if (!login.ok) throw new Error(\"Login failed: \" + login.status);
            const loginJson = await login.json();
            const token = loginJson?.data?.access_token;
            if (!token) throw new Error(\"No access token in login response\");

            const patch = await fetch(baseUrl + \"/settings\", {
              method: \"PATCH\",
              headers: {
                \"Authorization\": \"Bearer \" + token,
                \"Content-Type\": \"application/json\",
              },
              body: settings,
            });
            if (!patch.ok) {
              const body = await patch.text();
              throw new Error(\"PATCH /settings failed: \" + patch.status + \" \" + body);
            }
            console.log(\"Settings applied successfully.\");
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
        '
      "
    restart: 'no'

  directus-settings-export:
    image: directus/directus:11
    profiles: ['manual']
    depends_on:
      directus:
        condition: service_healthy
    environment:
      DIRECTUS_URL: ${DIRECTUS_INTERNAL_URL}
      DIRECTUS_ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      DIRECTUS_ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
    volumes:
      - ./:/schema
    entrypoint: >
      sh -c "
        echo 'Directus is ready. Exporting settings...' &&
        node -e '
          const fs = require(\"node:fs\");
          const baseUrl = process.env.DIRECTUS_URL;
          const email = process.env.DIRECTUS_ADMIN_EMAIL;
          const password = process.env.DIRECTUS_ADMIN_PASSWORD;
          (async () => {
            const login = await fetch(baseUrl + \"/auth/login\", {
              method: \"POST\",
              headers: { \"Content-Type\": \"application/json\" },
              body: JSON.stringify({ email, password }),
            });
            if (!login.ok) throw new Error(\"Login failed: \" + login.status);
            const loginJson = await login.json();
            const token = loginJson?.data?.access_token;
            if (!token) throw new Error(\"No access token in login response\");

            const res = await fetch(baseUrl + \"/settings\", {
              headers: { \"Authorization\": \"Bearer \" + token },
            });
            if (!res.ok) {
              const body = await res.text();
              throw new Error(\"GET /settings failed: \" + res.status + \" \" + body);
            }
            const json = await res.json();
            const data = json?.data ?? json;
            fs.writeFileSync(\"/schema/directus.settings.json\", JSON.stringify(data, null, 2) + \"\\n\");
            console.log(\"Settings exported successfully.\");
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
        '
      "
    restart: 'no'

  directus-schema-snapshot:
    image: directus/directus:11
    profiles: ['manual']
    depends_on:
      directus:
        condition: service_healthy
    environment:
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./schema.json:/schema/schema.json
    entrypoint: >
      sh -c "
        echo 'Directus is healthy. Creating schema snapshot...' &&
        npx directus schema snapshot /schema/schema.json --format json --yes &&
        node -e \"const fs=require('node:fs');const p='/schema/schema.json';const raw=fs.readFileSync(p,'utf8');const parsed=JSON.parse(raw);fs.writeFileSync(p,JSON.stringify(parsed,null,2)+'\\n');\"
      "
    restart: 'no'

  web:
    build:
      context: ../..
      dockerfile: infra/prod/web.Dockerfile
    restart: unless-stopped
    depends_on:
      directus-settings-apply:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_PUBLIC_DIRECTUS_URL: ${DIRECTUS_INTERNAL_URL}
      NUXT_PUBLIC_SITE_URL: ${SITE_URL}
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN}
      DIRECTUS_CACHE_TTL_SECONDS: ${DIRECTUS_CACHE_TTL_SECONDS}
      YANDEX_MAP_API_KEY: ${YANDEX_MAP_API_KEY}
      YANDEX_ORG_ID: ${YANDEX_ORG_ID}
    ports:
      - '${WEB_PORT}:3000'

volumes:
  akpp_prod_postgres:
  akpp_prod_redis:
  akpp_prod_directus_uploads:
  akpp_prod_directus_extensions:
