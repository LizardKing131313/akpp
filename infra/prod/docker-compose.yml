name: akpp-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - akpp_prod_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - akpp_prod_redis:/data

  directus:
    image: directus/directus:11
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}

      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      CACHE_ENABLED: 'true'
      CACHE_STORE: redis
      REDIS: redis://redis:6379

      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}

    volumes:
      - akpp_prod_directus_uploads:/directus/uploads
      - akpp_prod_directus_extensions:/directus/extensions

  web:
    build:
      context: ../..
      dockerfile: infra/prod/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - directus
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_PUBLIC_DIRECTUS_URL: ${DIRECTUS_INTERNAL_URL}
    ports:
      - '${WEB_PORT}:3000'

volumes:
  akpp_prod_postgres:
  akpp_prod_redis:
  akpp_prod_directus_uploads:
  akpp_prod_directus_extensions:
